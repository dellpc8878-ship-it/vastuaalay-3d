ServerName localhost
<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Directory "/var/www/html/python">
    Require all denied
</Directory>
<Directory "/var/www/html/storage">
    Require all denied
</Directory>
<Directory "/var/www/html/uploads">
    Options -Indexes -ExecCGI
    <FilesMatch "\.(php|phtml|phar|cgi|pl|py|sh|bat|exe)$">
        Require all denied
    </FilesMatch>
</Directory>
<FilesMatch "(^\.|\.(py|sh|bat|bak|txt|md|ini|yaml|yml|env|log)$)">
    Require all denied
</FilesMatch>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
